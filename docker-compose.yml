name: calculator-stack

services:
  calculator:
    build: .
    image: ${DOCKER_IMAGE:-calculator}:${IMAGE_TAG:-local}
    environment:
      SERVER_PORT: "8080"
    expose:
      - "8080"
    networks:
      - calc-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    networks:
      - calc-net
    restart: unless-stopped

networks:
  calc-net:
    driver: bridge
